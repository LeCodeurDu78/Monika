<!doctype html>
<html lang="fr">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#0d1210" media="(prefers-color-scheme: dark)">
  <meta name="theme-color" content="#f2f6f3" media="(prefers-color-scheme: light)">
  <meta name="mobile-web-app-capable" content="yes">
  <title>Monika</title>
  <link rel="icon" type="image/svg+xml" href="/static/favicon.svg">
  <link rel="stylesheet" href="/static/css/app.css">
  <script type="importmap">
  {
    "imports": {
      "three": "/static/vendor/three/three.module.js",
      "three/addons/": "/static/vendor/three/addons/",
      "@pixiv/three-vrm": "/static/vendor/three-vrm.module.js"
    }
  }
  </script>
</head>
<body class="app">
  <header class="top">
    <h1>Monika</h1>
    <span id="state-chip" class="chip" data-state="idle" role="status" aria-live="polite">Au repos</span>
    <span id="link-chip" class="chip chip-quiet" data-link="off">Connexion…</span>
    <span id="meta" class="meta"></span>
    <a class="chip chip-quiet" href="/settings">Réglages</a>
  </header>

  <main class="layout" id="layout">
    <!-- Deux sections, une seule visible : des radios décident de l'onglet, sans JavaScript. -->
    <input type="radio" class="tab-radio" name="section" id="tab-chat" checked>
    <input type="radio" class="tab-radio" name="section" id="tab-dashboard">
    <nav class="tabs" aria-label="Sections">
      <label class="tab" for="tab-chat">Chat</label>
      <label class="tab" for="tab-dashboard">Tableau de bord</label>
    </nav>

    <section class="stage" aria-label="Avatar">
      <canvas id="avatar" aria-label="Avatar 3D de Monika"></canvas>
      <p id="stage-note" class="stage-note" hidden></p>
    </section>

    <div class="splitter" id="splitter" role="separator" aria-orientation="vertical" aria-label="Redimensionner le panneau" tabindex="0">
      <button class="panel-toggle" id="panel-toggle" type="button" aria-controls="panels" aria-expanded="true" title="Masquer le panneau">❯</button>
    </div>

    <section class="panels" id="panels" aria-label="Tableau de bord">
      <div class="panels-scroll">
        <article class="panel" id="p-chat" data-tab="chat"><h2>Conversation</h2><div class="body"></div></article>
        <article class="panel" id="p-context" data-tab="dashboard"><h2>Contexte</h2><div class="body"></div></article>
        <article class="panel" id="p-relation" data-tab="dashboard"><h2>Relation</h2><div class="body"></div></article>
        <article class="panel" id="p-memory" data-tab="dashboard"><h2>Mémoire</h2><div class="body"></div></article>
        <article class="panel" id="p-sessions" data-tab="dashboard"><h2>Sessions</h2><div class="body"></div></article>
        <article class="panel" id="p-recipes" data-tab="dashboard"><h2>Recettes</h2><div class="body"></div></article>
        <article class="panel" id="p-tools" data-tab="dashboard"><h2>Outils perso</h2><div class="body"></div></article>
      </div>
    </section>
  </main>

  <div id="loading" role="status" aria-live="polite">
    <div class="loading-card">
      <p class="loading-title">Monika</p>
      <p id="loading-step" class="loading-step">Chargement…</p>
      <div class="loading-bar"><i id="loading-fill"></i></div>
    </div>
  </div>

  <script type="module" src="/static/js/dashboard.js"></script>
</body>
</html>
