<!doctype html>
<html lang="fr">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Monika</title>
  <meta name="monika-token" content="__MONIKA_TOKEN__">
  <link rel="icon" href="data:,">
  <link rel="stylesheet" href="/static/css/app.css">
  <script type="importmap">
  {
    "imports": {
      "three": "/static/vendor/three/three.module.js",
      "three/addons/": "/static/vendor/three/addons/",
      "@pixiv/three-vrm": "/static/vendor/three-vrm.module.js"
    }
  }
  </script>
</head>
<body>
  <header class="top">
    <h1>Monika</h1>
    <span id="state-chip" class="chip" data-state="idle" role="status" aria-live="polite">Au repos</span>
    <span id="link-chip" class="chip chip-quiet" data-link="off">Connexion…</span>
    <span id="meta" class="meta"></span>
  </header>

  <main class="layout">
    <section class="stage" aria-label="Avatar">
      <canvas id="avatar" aria-label="Avatar 3D de Monika"></canvas>
      <p id="stage-note" class="stage-note" hidden></p>
    </section>

    <section class="panels" aria-label="Tableau de bord">
      <article class="panel" id="p-context"><h2>Contexte</h2><div class="body"></div></article>
      <article class="panel" id="p-relation"><h2>Relation</h2><div class="body"></div></article>
      <article class="panel" id="p-memory"><h2>Mémoire</h2><div class="body"></div></article>
    </section>
  </main>

  <script type="module" src="/static/js/dashboard.js"></script>
</body>
</html>
